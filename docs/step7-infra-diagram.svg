" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/><text x="330" y="640" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#15803D">⑦ 外向き</text><rect x="1234.4" y="628.0" width="71.2" height="24" rx="6" fill="#FFFFFF" stroke="#15803D" stroke-width="1.2"/><text x="1270" y="640" font-size="12" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#15803D">⑦ 外向き</text><text x="30" y="1186" font-size="15" font-weight="700" text-anchor="start" dominant-baseline="central" fill="#232F3E">矢印の見方</text><path d="M40 1218 L84 1218" fill="none" stroke="#6B7280" stroke-width="3" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#m6B7280)"/><text x="98" y="1218" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">① 名前解決（利用者 → Route 53）</text><path d="M40 1248 L84 1248" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" marker-end="url(#m1D4ED8)"/><text x="98" y="1248" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">② 画面と API へのリクエスト（利用者 → Internet Gateway → ALB、HTTPS）</text><path d="M40 1278 L84 1278" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" marker-end="url(#m1D4ED8)"/><text x="98" y="1278" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">③ ALB → フロントの EC2（パスが /api/* 以外）</text><path d="M40 1308 L84 1308" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linejoin="round" marker-end="url(#m1D4ED8)"/><text x="98" y="1308" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">④ ALB → API の EC2（パスが /api/*）</text><path d="M860 1218 L904 1218" fill="none" stroke="#A21CAF" stroke-width="3" stroke-linejoin="round" marker-end="url(#mA21CAF)"/><text x="918" y="1218" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">⑤ API の EC2 → RDS のプライマリ（5432、TLS）</text><path d="M860 1248 L904 1248" fill="none" stroke="#A21CAF" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 6" marker-end="url(#mA21CAF)"/><text x="918" y="1248" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">⑥ 同期レプリケーション（プライマリ → スタンバイ）</text><path d="M860 1278 L904 1278" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" marker-end="url(#m15803D)"/><text x="918" y="1278" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">⑦ Google への外向き通信（API の EC2 → NAT Gateway → Internet Gateway → Google）</text><text x="30" y="1352" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">※ ACM の証明書は ALB に設定する。API の EC2 だけが Parameter Store から秘密情報を読む（IAM ロールで許可）。</text><text x="30" y="1378" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="central" fill="#232F3E">※ ログは両方の EC2 から CloudWatch へ送る。どの EC2 も SSH（22 番）を開けず、Session Manager で接続する。</text></svg>